name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Show the IP address of this GitHub machine
        run: |
          echo "Runner public IP: $(curl -s --max-time 15 https://api.ipify.org || echo unknown)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build .env from repository secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          {
            for v in DB_HOST DB_NAME DB_USER DB_PASS SITE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              val="${!v}"
              val="${val//\\/\\\\}"
              val="${val//\"/\\\"}"
              printf '%s="%s"\n' "$v" "$val"
            done
          } > "$RUNNER_TEMP/dotenv"

      - name: Test FTP login and show the folders (to find the right FTP_PATH)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          cat > "$RUNNER_TEMP/test.lftp" <<EOF
          set ftp:ssl-allow no
          set net:timeout 20
          set net:max-retries 1
          debug 3
          pwd
          ls
          ls "$FTP_PATH"
          bye
          EOF
          if lftp -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" < "$RUNNER_TEMP/test.lftp" > "$RUNNER_TEMP/test.log" 2>&1; then echo "FTP test OK"; else echo "::error title=FTP test failed::$(tail -n 25 "$RUNNER_TEMP/test.log" | paste -sd'|' - | cut -c1-1500)"; fi
          cat "$RUNNER_TEMP/test.log"

      - name: Deploy over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          for v in FTP_HOST FTP_USER FTP_PASS FTP_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
          case "$FTP_PATH" in
            *public_html|*public_html/|*/www|*/www/|*/htdocs|*/htdocs/) ;;
            *) echo "::error title=Unsafe FTP_PATH::FTP_PATH must point to the web folder itself (it should end with public_html). Refusing to deploy into a parent folder."; exit 1 ;;
          esac
          # Plain FTP (the hosting has no FTPS): login and files are NOT encrypted in transit.
          cat > "$RUNNER_TEMP/deploy.lftp" <<EOF
          set cmd:fail-exit yes
          debug -o "$RUNNER_TEMP/ftp-debug.log" 3
          set net:max-retries 2
          set net:timeout 30
          set net:reconnect-interval-base 5
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set ftp:prefer-epsv no
          set net:connection-limit 1
          mirror -R --no-perms --parallel=1 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .env --exclude-glob README.md --exclude-glob uploads/ --exclude-glob storage/ --exclude-glob error.log ./ "$FTP_PATH"
          put -O "$FTP_PATH" "$RUNNER_TEMP/dotenv" -o .env
          set cmd:fail-exit no
          chmod 600 "$FTP_PATH/.env"
          bye
          EOF
          if lftp -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" < "$RUNNER_TEMP/deploy.lftp" > "$RUNNER_TEMP/deploy.log" 2>&1; then
            tail -n 15 "$RUNNER_TEMP/deploy.log"
          else
            echo "::error title=FTP deploy failed::$(tail -n 8 "$RUNNER_TEMP/deploy.log" | paste -sd'|' - | cut -c1-600) || SERVER ANSWERS: $(grep -E '<--- [45][0-9][0-9]' "$RUNNER_TEMP/ftp-debug.log" | tail -n 12 | paste -sd'|' - | cut -c1-1200)"
            cat "$RUNNER_TEMP/deploy.log"
            exit 1
          fi
