name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Show the IP address of this GitHub machine
        run: |
          echo "Runner public IP: $(curl -s --max-time 15 https://api.ipify.org || echo unknown)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Build .env from repository secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          {
            for v in DB_HOST DB_NAME DB_USER DB_PASS SITE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              val="${!v}"
              val="${val//\\/\\\\}"
              val="${val//\"/\\\"}"
              printf '%s="%s"\n' "$v" "$val"
            done
          } > "$RUNNER_TEMP/dotenv"

      - name: Deploy over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_VERIFY_CERT: ${{ secrets.FTP_VERIFY_CERT }}
        run: |
          for v in FTP_HOST FTP_USER FTP_PASS FTP_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
          # Explicit FTPS (AUTH TLS): login and data are encrypted. The certificate check is off unless
          # FTP_VERIFY_CERT=yes, because shared hosting certificates often do not match the FTP host name.
          lftp -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate ${FTP_VERIFY_CERT:-no}
          set ftp:passive-mode yes
          mirror -R --delete --no-perms --parallel=4 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .env --exclude-glob README.md --exclude-glob uploads/ --exclude-glob storage/ --exclude-glob error.log ./ "$FTP_PATH"
          put -O "$FTP_PATH" -o .env "$RUNNER_TEMP/dotenv"
          set cmd:fail-exit no
          chmod 600 "$FTP_PATH/.env"
          bye
          EOF
